[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictedge"
version = "0.1.0"
description = "Pre-registered probabilistic forecasting research on prediction markets (Kalshi)"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "scipy",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
predictedge = "predictedge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
