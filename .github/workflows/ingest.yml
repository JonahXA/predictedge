# Daily archival ingest. Kalshi's public API only retains ~2 months of
# settled markets, so this cron is what makes the committed archive the
# durable record — it runs even when nobody's laptop is on.
#
# Incremental by design: candles are fetched only for markets not yet
# in data/archive/candles.parquet (~40 new markets/day, well under any
# rate limit).
name: ingest

on:
  schedule:
    - cron: "0 15 * * *"  # 15:00 UTC, after ~12:00 UTC weather settlements
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: predictedge ingest
      - run: predictedge forecast
      - name: Commit archive updates
        run: |
          git config user.name "predictedge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/archive forecasts
          git diff --cached --quiet && exit 0
          git commit -m "ingest: archive update $(date -u +%F)"
          git push
